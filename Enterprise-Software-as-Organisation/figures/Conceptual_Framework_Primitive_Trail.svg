  <rect width="800" height="890" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172c3c" text-anchor="middle">
    <text x="400" y="43" font-size="28" font-weight="700">From construct to theoretical pattern</text>
    <text x="400" y="77" font-size="21" fill="#425568">The required audit trail</text>
