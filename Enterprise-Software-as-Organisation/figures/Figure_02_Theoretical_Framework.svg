<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Theoretical framework: software operations in organisational relations</title>
  <desc id="desc">Differentiated work creates dependencies. Coordination, information processing, decision and governance perspectives ask different questions of the same software operation. A technical construct is organisationally relevant when its operation demonstrably connects, assigns, informs or constrains work. The framework does not imply effective coordination or actual authority.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#526276"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172c3c">
    <text x="28" y="38" font-size="26" font-weight="700">When does a software operation organise work?</text>
    <text x="28" y="68" font-size="17" fill="#425568">Different perspectives on the same arrangement, not stages of one process</text>
    <rect x="28" y="94" width="904" height="79" rx="10" fill="#f5f7fa" stroke="#9baab8"/>
    <text x="48" y="124" font-size="20" font-weight="700">Division of work creates dependencies</text>
    <text x="48" y="150" font-size="17">What does one activity need from another? (Thompson; Malone and Crowston)</text>
    <path d="M480 174v25" fill="none" stroke="#526276" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="187" y="205" width="586" height="75" rx="10" fill="#eaf6f3" stroke="#166254" stroke-width="2"/>
    <text x="480" y="235" font-size="20" text-anchor="middle" font-weight="700">A record, rule or workflow acts in that relation</text>
    <text x="480" y="259" font-size="17" text-anchor="middle">Identify the operation, its target and its documented consequence.</text>
    <path d="M480 281v19M170 317v-17h620v17M480 300v17" fill="none" stroke="#526276" stroke-width="1.6"/>
    <g fill="#f5f7fa" stroke="#9baab8">
      <rect x="28" y="317" width="284" height="127" rx="10"/>
      <rect x="338" y="317" width="284" height="127" rx="10"/>
      <rect x="648" y="317" width="284" height="127" rx="10"/>
    </g>
    <g font-size="19" font-weight="700">
      <text x="47" y="348">Coordination</text>
      <text x="357" y="348">Information processing</text>
      <text x="667" y="348">Decision and governance</text>
    </g>
    <g font-size="16.5">
      <text x="47" y="374">How is dependent work</text><text x="47" y="396">connected or timed?</text>
      <text x="357" y="374">What is visible, and what</text><text x="357" y="396">actually supplies a later input?</text>
      <text x="667" y="374">What routes the decision, who</text><text x="667" y="396">may act, and what changes?</text>
    </g>
    <g fill="#425568" font-size="14">
      <text x="47" y="424">Mintzberg; Malone and Crowston</text>
      <text x="357" y="424">Galbraith</text>
      <text x="667" y="424">Simon; Aghion and Tirole</text>
    </g>
    <rect x="28" y="466" width="904" height="52" rx="9" fill="#fff6e7" stroke="#9a6c2e"/>
    <text x="47" y="498" font-size="17" fill="#573c17">Represented dependencies and decisions do not establish effective coordination or real authority.</text>
  </g>
</svg>
